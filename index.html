<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HuertoHogar - Del campo al hogar</title>
  
  <!-- Fuentes oficiales del proyecto: Montserrat y Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Encabezado y Navegacion -->
  <header class="navbar">
    <div class="logo">
      <h1>HuertoHogar</h1>
      <p class="tagline">Del campo al hogar</p>
    </div>
    <nav>
      <a href="#catalogo">Catálogo</a>
      <a href="#nosotros">Nosotros</a>
      <a href="#ubicaciones">Tiendas</a>
      <button class="cart-btn">🛒 Carrito (<span id="cart-count">0</span>)</button>
    </nav>
  </header>
<!-- Banner Principal -->
  <section class="hero">
    <div class="hero-content">
      <h2>Frescura y Calidad Directo a tu Puerta</h2>
      <p>Conectamos a las familias chilenas con nuestros agricultores locales.</p>
      <a href="#catalogo" class="btn-primary">Ver Productos</a>
    </div>
  </section>
 <!-- Catalogo de Productos y Filtros -->
  <section id="catalogo" class="container">
    <h2>Nuestros Productos</h2>
    
    <!-- Filtros de Categoria -->
    <div class="filter-buttons">
      <button class="filter-btn active" onclick="filtrarProductos('todos')">Todos</button>
      <button class="filter-btn" onclick="filtrarProductos('Frutas Frescas')">Frutas Frescas</button>
      <button class="filter-btn" onclick="filtrarProductos('Verduras Orgánicas')">Verduras Orgánicas</button>
      <button class="filter-btn" onclick="filtrarProductos('Productos Orgánicos')">Productos Orgánicos</button>
    </div>

    <!-- Rejilla donde JS cargará las tarjetas -->
    <div id="product-grid" class="grid"></div>
  </section>


  

  <script src="script.js"></script>
</body>
</html>
